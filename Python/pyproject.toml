[project]
name = "black-hole-python"
version = "0.1.0"
description = "Black hole ray tracer: Python + Vulkan 1.3 + GLFW (Wayland)"
requires-python = ">=3.12"
dependencies = [
    "vulkan>=1.3.275",  # bindings cffi do Vulkan
    "glfw>=2.8",        # janela/eventos; o wheel traz libglfw com backend Wayland
    "numpy>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
